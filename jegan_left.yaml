meta:
  engine: 4.1.0
  author: Henry Hu
units:
  kx: U
  ky: U
  px: kx + 4
  py: ky + 4
  screwSize: 1
points:
  zones:
    matrix:
      key:
        padding: kx+0.5
        spread: ky+0.5
        width: kx
        height: ky
      rows:
        mod:
          row_net: P14          
        bottom:
          row_net: P15          
        middle:
          row_net: P18
        top:
          row_net: P19
        number:
          row_net: P20
        fn:
          row_net: P21
      columns:
        first:
          rows:
            top.skip: true
            middle.skip: true
            bottom.skip: true
            mod.skip: true
            number:
              key.led_prev: led_second_number
              key.led_next: led_first_number
            fn:
              key.led_prev: P4
              key.led_next: led_first_fn
          key:
            column_net: P16
        second:
          rows:
            mod:
              width: 1.25u
              shift: [-0.9u, 0]
              key.led_prev: led_third_mod
              key.led_next: led_second_mod
            bottom:
              width: 2.25u
              shift: [0.5u, 0]
              key.led_prev: led_second_middle
              key.led_next: led_second_bottom
            middle:
              width: 1.75u
              shift: [-0.25u, 0]
              key.led_prev: led_third_middle
              key.led_next: led_second_middle
            top:
              width: 1.5u
              shift: [-0.125u, 0]
              key.led_prev: led_first_number
              key.led_next: led_second_top
            number:
              shift: [0.775u, 0]
              key.led_prev: led_third_number
              key.led_next: led_second_number
            fn:
              key.led_prev: led_first_fn
              key.led_next: led_second_fn
          key:
            column_net: P10
        third:
          rows:
            mod:
              shift: [-0.775u, 0]
              key.led_prev: led_fourth_mod
              key.led_next: led_third_mod
            bottom:
              shift: [1u, 0]
              key.led_prev: led_second_bottom
              key.led_next: led_third_bottom
            middle:
              shift: [-0.5u, 0]
              key.led_prev: led_fourth_middle
              key.led_next: led_third_middle
            top:
              shift: [-0.25u, 0]
              key.led_prev: led_second_top
              key.led_next: led_third_top
            number:
              shift: [0.525u, 0]
              key.led_prev: led_fourth_number
              key.led_next: led_third_number
            fn:
              key.led_prev: led_second_fn
              key.led_next: led_third_fn
          key:
            column_net: P9
        fourth:
          rows:
            mod:
              shift: [-0.775u, 0]
              key.led_prev: led_fifth_mod
              key.led_next: led_fourth_mod
            bottom:
              shift: [1u, 0]
              key.led_prev: led_third_bottom
              key.led_next: led_fourth_bottom
            middle:
              shift: [-0.5u, 0]
              key.led_prev: led_fifth_middle
              key.led_next: led_fourth_middle
            top:
              shift: [-0.25u, 0]
              key.led_prev: led_third_top
              key.led_next: led_fourth_top
            number:
              shift: [0.525u, 0]
              key.led_prev: led_fifth_number
              key.led_next: led_fourth_number
            fn:
              key.led_prev: led_third_fn
              key.led_next: led_fourth_fn
          key:
            column_net: P8
        fifth:
          rows:
            mod:
              width: 1.25u
              shift: [-0.65u, 0]
              key.led_prev: led_sixth_mod
              key.led_next: led_fifth_mod
            bottom:
              shift: [0.875u, 0]
              key.led_prev: led_fourth_bottom
              key.led_next: led_fifth_bottom
            middle:
              shift: [-0.5u, 0]
              key.led_prev: led_sixth_middle
              key.led_next: led_fifth_middle
            top:
              shift: [-0.25u, 0]
              key.led_prev: led_fourth_top
              key.led_next: led_fifth_top
            number:
              shift: [0.525u, 0]
              key.led_prev: led_sixth_number
              key.led_next: led_fifth_number
            fn:
              key.led_prev: led_fourth_fn
              key.led_next: led_fifth_fn
          key:
            column_net: P7
        sixth:
          rows:
            mod:
              width: 2.25u
              shift: [0.1u, 0]
              key.led_prev: led_seventh_bottom
              key.led_next: led_sixth_mod
            bottom:
              shift: [0.125u, 0]
              key.led_prev: led_fifth_bottom
              key.led_next: led_sixth_bottom
            middle:
              shift: [-0.5u, 0]
              key.led_prev: led_seventh_middle
              key.led_next: led_sixth_middle
            top:
              shift: [-0.25u, 0]
              key.led_prev: led_fifth_top
              key.led_next: led_sixth_top
            number:
              shift: [0.525u, 0]
              key.led_prev: led_seventh_number
              key.led_next: led_sixth_number
            fn:
              key.led_prev: led_fifth_fn
              key.led_next: led_sixth_fn
          key:
            column_net: P6
        seventh:
          rows:
            mod:
              skip: true
            bottom:
              shift: [0.225u, 0]
              key.led_prev: led_sixth_bottom
              key.led_next: led_seventh_bottom
            middle:
              shift: [-0.5u, 0]
              key.led_prev: led_seventh_top
              key.led_next: led_seventh_middle
            top:
              shift: [-0.25u, 0]
              key.led_prev: led_sixth_top
              key.led_next: led_seventh_top
            number:
              shift: [0.525u, 0]
              key.led_prev: led_seventh_fn
              key.led_next: led_seventh_number
            fn:
              key.led_prev: led_sixth_fn
              key.led_next: led_seventh_fn
          key:
            column_net: P5              
      anchor:
        shift: [100, -150]
outlines:
  raw:
    - what: rectangle
      where: true
      size: [px, py]
  keys:
    - what: rectangle
      where: true
      size: [kx - 0.5, ky - 0.5]
  key_hole:
    - what: rectangle
      where: true
      size: [14, 14]
  board:
    - what: polygon
      operation: stack
      points:
        - ref: matrix_first_fn
          shift: [-0.5px, 0.5py]
        - ref: matrix_seventh_fn
          shift: [1.5px, 0.5py]
        - ref: matrix_sixth_mod
          shift: [2.25px, -0.5py]
        - ref: matrix_second_mod
          shift: [-0.6px, -0.5py]
      fillet: 2
  board_less:
    - what: polygon
      operation: stack
      points:
        - ref: matrix_first_fn
          shift: [-0.5px, 0.5py]
        - ref: matrix_seventh_fn
          shift: [0.5px, 0.5py]
        - ref: matrix_seventh_number
          shift: [0.5px, -0.45py]
        - ref: matrix_seventh_top
          shift: [0.5px, 0.4py]
        - ref: matrix_seventh_top
          shift: [0.5px, -0.4py]
        - ref: matrix_seventh_middle
          shift: [0.5px, 0.45py]
        - ref: matrix_seventh_middle
          shift: [0.5px, -0.4py]
        - ref: matrix_seventh_bottom
          shift: [0.5px, 0.45py]
        - ref: matrix_seventh_bottom
          shift: [0.5px, -0.4py]
        - ref: matrix_sixth_mod
          shift: [1.45px, -0.5py]
        - ref: matrix_second_mod
          shift: [-0.6px, -0.5py]
      fillet: 2
  combo:
    - name: board
    - operation: subtract
      name: keys
  top_plate:
    - name: board_less
    - operation: subtract
      name: key_hole
  top_on_pcb:
    - name: combo
    - name: top_plate
      operation: subtract
  mounting:
    - what: circle
      radius: screwSize
      where:
        ref: [matrix_first_fn]
        shift: [0.5kx, -0.3ky]
    - what: circle
      radius: screwSize
      where:
        ref: [matrix_seventh_fn]
        shift: [0.5kx, -0.2ky]
    - what: circle
      radius: screwSize
      where:
        ref: [matrix_second_mod]
        shift: [0.5kx, -0.3ky]
    - what: circle
      radius: screwSize
      where:
        ref: [matrix_sixth_mod]
        shift: [1.5kx, -0.3ky]
pcbs:
  left:
    template: kicad8
    outlines:
      main:
        outline: board
    footprints:
      choc_hotswap:
        what: ceoloide/switch_choc_v1_v2
        where: true
        params:
          include_keycap: true
          #include_choc_v1_led_cutout_marks: true
          keycap_height: u
          keycap_width: u
          hotswap: true
          #hotswap_pads_same_side: true
          choc_v2_support: false
          
          from: "{{column_net}}"
          to: "{{colrow}}"
          hotswap_3dmodel_filename: "${KICAD_USER_3DMODEL_DIR}/Choc_V1_Hotswap.step"
          hotswap_3dmodel_xyz_rotation: [180, 0, 0]
          switch_3dmodel_filename: "${KICAD_USER_3DMODEL_DIR}/Choc_V1_Switch.step"
          switch_3dmodel_xyz_rotation: [180, 0, 0]
      left_shift:
        what: choc_stabilizer
        where: /matrix_second_bottom/
        adjust:
          rotate: 180
      spacebar:
        what: choc_stabilizer
        where: /matrix_sixth_mod/
        adjust:
          rotate: 180
      diode:
        what: ceoloide/diode_tht_sod123
        where: true
        params:
          from: "{{colrow}}"
          to: "{{row_net}}"
          diode_3dmodel_filename: "${KICAD_USER_3DMODEL_DIR}/Diode_1N4148W.step"
          diode_3dmodel_xyz_rotation: [90, 0, 0]
        adjust:
          shift: [5, 8]
      rgb:
        what: ceoloide/led_sk6812mini-e
        where: /^matrix_.*_(fn|top|bottom)/
        params:
          vcc_trace_width: 0.4
          gnd_trace_width: 0.4
          include_traces_vias: false
          P2: "{{key.led_next}}"
          P4: "{{key.led_prev}}"
          led_3dmodel_filename: "${KICAD10_3DMODEL_DIR}/LED_SMD.3dshapes/LED_SK6812MINI-E_3.2x2.8mm_P1.5mm_ReverseMount.step"
        adjust:
          shift: [0, -4.65]
      rgb_inverse:
        what: ceoloide/led_sk6812mini-e
        where: /^matrix_.*_(number|middle|mod)/
        params:
          vcc_trace_width: 0.4
          gnd_trace_width: 0.4
          P2: "{{key.led_next}}"
          P4: "{{key.led_prev}}"
          led_3dmodel_filename: "${KICAD10_3DMODEL_DIR}/LED_SMD.3dshapes/LED_SK6812MINI-E_3.2x2.8mm_P1.5mm_ReverseMount.step"
        adjust:
          shift: [0, -4.65]
          rotate: 180
      mcu:
        what: ceoloide/mcu_nice_nano
        where:
          ref: matrix_seventh_fn
          shift: [px, -0.3py]
        params:
          reverse_mount: true
          mcu_3dmodel_filename: "${KICAD_USER_3DMODEL_DIR}/Nice_Nano_V2.step"
      oled:
        what: ceoloide/display_ssd1306
        params:
          side: "F"
          SDA: P2
          SCL: P3
        where:
          ref: matrix_seventh_fn
          shift: [px, -0.5py]
      battery:
        what: ceoloide/battery_connector_jst_ph_2
        where:
          ref: matrix_seventh_top
          shift: [px - 1, 0]
          rotate: 180
        params:
          BAT_P: POS
          BAT_N: GND
          battery_connector_3dmodel_filename: "${KICAD10_3DMODEL_DIR}/Connector_JST.3dshapes/JST_PH_S2B-PH-K_1x02_P2.00mm_Horizontal.step"
          battery_connector_3dmodel_xyz_offset: [-1, 0, 0]
      power:
        what: ceoloide/power_switch_smd_side
        where:
          ref: matrix_seventh_top
          shift: [px + 16, 0]
        params:
          from: POS
          to: RAW
          switch_3dmodel_filename: "${KICAD_USER_3DMODEL_DIR}/Switch_Power.step"
          switch_3dmodel_xyz_rotation: [-90, 0, -90]
      reset:
        what: ceoloide/reset_switch_smd_side
        params:
          side: "B"
          from: GND
          to: RST
          reset_switch_3dmodel_filename: "${KICAD_USER_3DMODEL_DIR}/Switch_Reset.step"
          reset_switch_3dmodel_xyz_rotation: [-90, 0, 0]
        where:
          ref: matrix_seventh_fn
          shift: [px, -0.5py - 25]
          rotate: -90
      holeTopLeft:
        what: ceoloide/mounting_hole_npth
        where:
          ref: [matrix_first_fn]
          shift: [0.5kx, -0.3ky]
      holeTopRight:
        what: ceoloide/mounting_hole_npth
        where:
          ref: [matrix_seventh_fn]
          shift: [0.5kx, -0.2ky]
      holeBottomLeft:
        what: ceoloide/mounting_hole_npth
        where:
          ref: [matrix_second_mod]
          shift: [0.5kx, -0.3ky]
      holeBottomRight:
        what: ceoloide/mounting_hole_npth
        where:
          ref: [matrix_sixth_mod]
          shift: [1.5kx, -0.3ky]
  left_top:
    template: kicad8
    outlines:
      main:
        outline: top_plate
    footprints:
      spacebar:
        what: choc_stabilizer_top_plate
        where:
          ref: [matrix_sixth_mod]
        adjust:
          rotate: 180
      left_shift:
        what: choc_stabilizer_top_plate
        where:
          ref: [matrix_second_bottom]
        adjust:
          rotate: 180  
      holeTopLeft:
        what: ceoloide/mounting_hole_npth
        where:
          ref: [matrix_first_fn]
          shift: [0.5kx, -0.3ky]
      holeTopRight:
        what: ceoloide/mounting_hole_npth
        where:
          ref: [matrix_seventh_fn]
          shift: [0.5kx, -0.2ky]
      holeBottomLeft:
        what: ceoloide/mounting_hole_npth
        where:
          ref: [matrix_second_mod]
          shift: [0.5kx, -0.3ky]
      holeBottomRight:
        what: ceoloide/mounting_hole_npth
        where:
          ref: [matrix_sixth_mod]
          shift: [1.5kx, -0.3ky]
  left_bottom:
    template: kicad8
    outlines:
      main:
        outline: board
    footprints:
      holeTopLeft:
        what: ceoloide/mounting_hole_npth
        where:
          ref: [matrix_first_fn]
          shift: [0.5kx, -0.3ky]
      holeTopRight:
        what: ceoloide/mounting_hole_npth
        where:
          ref: [matrix_seventh_fn]
          shift: [0.5kx, -0.2ky]
      holeBottomLeft:
        what: ceoloide/mounting_hole_npth
        where:
          ref: [matrix_second_mod]
          shift: [0.5kx, -0.3ky]
      holeBottomRight:
        what: ceoloide/mounting_hole_npth
        where:
          ref: [matrix_sixth_mod]
          shift: [1.5kx, -0.3ky]
cases:
  bottom:
    - name: board
      extrude: 1
  _holes:
    - name: mounting
      extrude: 4
  case:
    - what: case
      name: bottom
      operation: add
    - what: case
      name: _holes
      operation: add